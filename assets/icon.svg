<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Recipe Studio desktop icon.
       Edit this file, then run "npm run icon" to rebuild assets/recipe-studio.ico.
       Everything is drawn thick on purpose: it has to stay readable at 16 pixels. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#d1734a"/>
      <stop offset="1" stop-color="#9e4a26"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <!-- steam -->
  <g fill="none" stroke="#fbf1e8" stroke-width="28" stroke-linecap="round" opacity="0.9">
    <path d="M188 156 C 166 132, 210 116, 188 94"/>
    <path d="M256 142 C 234 118, 278 102, 256 80"/>
    <path d="M324 156 C 302 132, 346 116, 324 94"/>
  </g>

  <!-- bowl: a rounded rim sitting on a deep bowl -->
  <path d="M110 254 H 402 A 146 146 0 0 1 110 254 Z" fill="#fbf1e8"/>
  <rect x="80" y="222" width="352" height="46" rx="23" fill="#fbf1e8"/>
  <path d="M150 268 H 362 A 106 106 0 0 1 150 268 Z" fill="#000000" opacity="0.07"/>
</svg>
