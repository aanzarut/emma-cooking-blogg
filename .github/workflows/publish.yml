# Builds the website from the recipe library and puts it on Cloudflare Pages.
#
# Runs on every push to main that touches the recipes, the config or the site
# code — which is what "Put the website online" in the Studio produces. It
# can also be started by hand from the Actions tab (workflow_dispatch).
#
# Needs two repository secrets, set once (see PUBLISHING.md):
#   CLOUDFLARE_API_TOKEN   a token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard's overview page
# and a Cloudflare Pages project whose name matches --project-name below.

name: Publish website

on:
  push:
    branches: [main]
    paths:
      - 'library/**'
      - 'config/**'
      - 'site/**'
      - 'studio/lib/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the website
        run: npm run build

      - name: Put it on Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=emmas-kitchen --branch=main
